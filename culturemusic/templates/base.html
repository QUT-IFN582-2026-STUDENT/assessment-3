<!doctype html>
<html lang="en">
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Culture Music - {% block title %}{% endblock %}</title>
    <meta name="description" content="Culture Music" />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header class="header-section sticky-top">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid navbar-inner">
          <a
            class="navbar-brand site-brand text-decoration-none"
            href="{{ url_for('main.index') }}"
          >
            <div class="logo">
              <img
                src="{{ url_for('static', filename='img/logo-cm150x63.png') }}"
                alt="Culture Music Festival Logo"
              />
            </div>
            <div class="brand-tagline fst-italic">Celebrate Heritage Music</div>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav site-nav mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="{{ url_for('main.index') }}"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('main.campaign') }}"
                  >Campaign</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('main.donation') }}"
                  >Donation</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('main.admin') }}">Admin</a>
              </li>
            </ul>
            <form
              class="search-form d-flex flex-wrap gap-2 align-items-center"
              role="search"
            >
              <input
                class="form-control search-input"
                type="search"
                placeholder="Search Events"
                aria-label="Search Events"
              />
              <select
                class="form-select filter-select gap-2"
                name="location"
                aria-label="Choose Location"
              >
                <option value="">Choose Location</option>
                <option value="brisbane">Brisbane</option>
                <option value="gold_coast">Gold Coast</option>
                <option value="sunshine_coast">Sunshine Coast</option>
              </select>
              <div class="d-flex px-2 gap-2">
                <button class="btn btn-search" type="submit">Search</button>
                <a
                  class="btn btn-login d-inline-flex align-items-center"
                  href="{{ url_for('main.login') }}"
                  >Login</a
                >
              </div>
            </form>
          </div>
        </div>
      </nav>
    </header>

    {% block head %}{% endblock %}

    <main class="main-content">{% block main %}{% endblock %}</main>

    <footer class="footer-section">
      <div class="container-fluid py-5">
        <div class="row">
          <div class="col-md-8">
            <nav class="footer-nav mb-4">
              <a href="#guidelines">Privacy &amp; Fundraising Guidelines</a>
              |
              <a href="#terms">Terms and Conditions</a>
              |
              <a href="#contact">Contact Us</a>
              |
              <a href="{{ url_for('main.login') }}">Login/Register</a>
            </nav>
          </div>
        </div>
      </div>
    </footer>
  </body>
  <!-- Bootstrap 5 JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-lpyS/FD6Bi5VXdkP0rG8QbUUtGm1ik7JAE0HgRAA0D3Wxk7gx4vmVoKfP9Tc1xk6"
    crossorigin="anonymous"
  ></script>
</html>
